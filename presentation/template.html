<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Crisis · Волтова дъга</title>
<link rel="stylesheet" href="fonts/faces.css">
<style>
/* Arcade Neon deck: navy ground, P1 cyan, P2 pink, logo teal and yellow. 16:9 stage scaled to the window. */
:root {
  --ground: #0b1424; --panel: #111d33; --line: #1f3355; --text: #e8f1ff; --muted: #9db0cf;
  --cyan: #2ee6ff; --pink: #ff4fa3; --teal: #1fc7b6; --volt: #ffd23f;
  --display: "Unbounded", "Bahnschrift", "Segoe UI", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050a14; color: var(--text); font-family: var(--body); overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; }
.slide { position: absolute; inset: 0; display: none; padding: 80px 96px 90px; gap: 56px;
  background: radial-gradient(1200px 700px at 85% 10%, rgba(46,230,255,.10), transparent 60%),
              radial-gradient(900px 600px at 0% 100%, rgba(255,79,163,.10), transparent 60%), var(--ground); }
.slide.active { display: flex; animation: in .45s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .slide.active { animation: none; } }
.slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: repeating-linear-gradient(135deg, var(--volt) 0 18px, transparent 18px 36px); opacity: .55; }
.copy { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.media { flex: 1.15 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.split.two .media figure { max-height: 340px; }
.kicker { font-family: var(--mono); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
h2 { font-family: var(--display); font-weight: 700; font-size: 54px; line-height: 1.08; margin: 0; text-wrap: balance;
  background: linear-gradient(90deg, var(--cyan), #9ff4ff 45%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { font-size: 27px; line-height: 1.45; margin: 0; color: var(--text); max-width: 34ch; }
.text p, .title p { max-width: 52ch; }
ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
li { font-size: 25px; line-height: 1.4; padding-left: 34px; position: relative; color: var(--text); }
li::before { content: ""; position: absolute; left: 4px; top: .55em; width: 14px; height: 14px; border-radius: 3px;
  background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
li:nth-child(even)::before { background: var(--pink); box-shadow: 0 0 12px var(--pink); }
b { color: var(--volt); font-weight: 700; }
code { font-family: var(--mono); font-size: .85em; color: var(--cyan); background: rgba(46,230,255,.08); padding: 1px 8px; border-radius: 6px; border: 1px solid rgba(46,230,255,.25); }
figure { margin: 0; border-radius: 14px; overflow: hidden; border: 2px solid var(--line); background: #000;
  box-shadow: 0 0 0 1px rgba(46,230,255,.25), 0 0 36px rgba(46,230,255,.18), 0 24px 60px rgba(0,0,0,.55); }
figure img { display: block; width: 100%; height: 100%; object-fit: cover; }
table { border-collapse: collapse; font-size: 21px; width: 100%; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); }
th { font-family: var(--mono); font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
td:first-child { color: var(--volt); font-weight: 700; }
.title { flex-direction: column; justify-content: center; align-items: flex-start;
  background: linear-gradient(90deg, rgba(11,20,36,.96) 0 45%, rgba(11,20,36,.55)), url(img/s01-intro.png) center/cover; }
.title .copy { flex: 0 0 auto; max-width: 900px; }
.title h2 { font-size: 92px; }
.title .media { display: none; }
.text li { font-size: 34px; } .text p { font-size: 34px; } .text h2 { font-size: 64px; } .text .copy { gap: 26px; } .text ul { gap: 20px; }
.notes { display: none; }
#bar { position: fixed; left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--cyan), var(--pink)); transition: width .3s; }
#count { position: fixed; right: 18px; bottom: 12px; font-family: var(--mono); font-size: 14px; color: var(--muted); }
body.shownotes .slide.active .notes { display: block; position: absolute; left: 96px; right: 96px; bottom: 20px; font-size: 20px; color: var(--muted);
  background: rgba(5,10,20,.9); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
@media print {
  @page { size: 1600px 900px; margin: 0; }
  html, body { overflow: visible; height: auto; background: var(--ground); }
  #stage { position: static; transform: none !important; width: 1600px; height: auto; }
  .slide { display: flex !important; position: relative; width: 1600px; height: 900px; page-break-after: always; animation: none !important; }
  #bar, #count { display: none; }
}
</style>
</head>
<body>
<div id="stage">
__SLIDES__
</div>
<div id="bar"></div><div id="count"></div>
<script>
(function () {
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var stage = document.getElementById('stage');
  var i = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  function fit() {
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    stage.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
    stage.style.transformOrigin = '0 0';
    stage.style.left = '50%'; stage.style.top = '50%';
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    stage.style.transformOrigin = 'center center';
  }
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    document.getElementById('bar').style.width = ((i + 1) / slides.length * 100) + '%';
    document.getElementById('count').textContent = (i + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#' + (i + 1));
  }
  document.addEventListener('keydown', function (e) {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('shownotes');
    else if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  });
  document.addEventListener('click', function (e) { show(e.clientX > window.innerWidth / 3 ? i + 1 : i - 1); });
  window.addEventListener('resize', fit);
  if (location.search.indexOf('print') < 0) { fit(); show(i); }
})();
</script>
</body>
</html>
